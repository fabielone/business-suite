name: desktop-local-foundation
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:desktop:renderer
      - run: npm run build:desktop:demo
      - run: npm run test:desktop
      - if: runner.os == 'macOS'
        run: npm run package:desktop:mac
      - if: runner.os == 'Windows'
        run: npm run package:desktop:win
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-desktop-${{ matrix.os }}
          path: |
            apps/desktop/artifacts/*/*.dmg
            apps/desktop/artifacts/*/*.zip
            apps/desktop/artifacts/*/*.exe
          if-no-files-found: error
